<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>
    <center>

        <h1>Feedback Form</h1>
        <form action="">    

            <label >Name</label>
            <input type="text"> <br><br>

            <label>Email</label>
            <input type="email"><br><br>

            <label >Student performance:</label>
            <input type="radio" name="Student performance" >Good
            <input type="radio" name="Student performance" id="">Average
            <input type="radio" name="Student performance" id="">Below Average <br><br>

            <label for="">Your Feedback</label><br>
            <textarea rows="5" cols="25"></textarea> <br><br>

            <input type="submit" value="submit your feedback"><br><br>
            <input type="submit" value="Reset">

        </form>

    </center>
</body>
</html>
