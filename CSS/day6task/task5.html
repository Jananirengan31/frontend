<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colored Boxes</title>
    <link rel="stylesheet" href="assets/css/task5.css">

    
</head>
<body>
    
        <div class="parent">
     
    <div class="box static" >
        <h2>Box 1</h2>
        <p>This is the first colored box.</p>
    </div>

    <br>

    <div class="box relative" >
        <h2>Box 2</h2>
        <p>This is the second colored box.</p>
    </div>

    <br>

    <div class="box absolute" >
        <h2>Box 3</h2>
        <p>This is the third colored box.</p>
    </div>

    <div class="box fixed" >
        <h2>Box 4</h2>
        <p>This is the fourth colored box.</p>
    </div>

    <div class="box sticky" >
        <h2>Box 5</h2>
        <p>This is the fifth colored box.</p>
    </div>

    </div>


</body>
</html>
