<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Cards</title>
    <link rel="stylesheet" href="assets/css/task2.css">
</head>
<body>
    <div class="parent">
         <h1>Sports Products</h1>

    <div class="product-container">

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1517466787929-bc90951d0974?auto=format&fit=crop&w=500&q=80" alt="Football">
            <h2>Football</h2>
            <p class="price">Rs.899</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=500&q=80" alt="Basketball">
            <h2>Basketball</h2>
            <p class="price">Rs.1,199</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1554068865-24cecd4e34b8?auto=format&fit=crop&w=500&q=80" alt="Tennis Racket">
            <h2>Tennis Racket</h2>
            <p class="price">Rs.2,499</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1539185441755-769473a23570?auto=format&fit=crop&w=500&q=80" alt="Running Shoes">
            <h2>Running Shoes</h2>
            <p class="price">Rs.2,999</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=500&q=80" alt="Dumbbells">
            <h2>Dumbbells</h2>
            <p class="price">Rs.1,499</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1552674605-db6ffd4facb5?auto=format&fit=crop&w=500&q=80" alt="Sports Watch">
            <h2>Sports Watch</h2>
            <p class="price">Rs.3,499</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1580748141549-71748dbe0bdc?auto=format&fit=crop&w=500&q=80" alt="Cricket Bat">
            <h2>Cricket Bat</h2>
            <p class="price">Rs.2,199</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://images.unsplash.com/photo-1551698618-1dfe5d97d256?auto=format&fit=crop&w=500&q=80" alt="Sports Bag">
            <h2>Sports Bag</h2>
            <p class="price">Rs.999</p>
            <button>Buy Now</button>
        </div>

    </div>


    </div>
</body>
</html>
