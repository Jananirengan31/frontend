<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card Lift Effect</title>
    <link rel="stylesheet" href="assets/css/task3.css">
</head>
<body>

    <div class="title">

    <h1>Sports Product Cards</h1>

    <div class="product-container">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1517649763962-0c623066013b?w=300&h=200&fit=crop" alt="Football">
            <h3>Football</h3>
            <p class="price">899</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc?w=300&h=200&fit=crop" alt="Basketball">
            <h3>Basketball</h3>
            <p class="price">1,299</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1531415074968-036ba1b575da?w=300&h=200&fit=crop" alt="Cricket Bat">
            <h3>Cricket Bat</h3>
            <p class="price">2,499</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1554068865-24cecd4e34b8?w=300&h=200&fit=crop" alt="Tennis Racket">
            <h3>Tennis Racket</h3>
            <p class="price">1,799</p>
            <button>Buy Now</button>
        </div>

    </div>
    </div>

</body>
</html>
