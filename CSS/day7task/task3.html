<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <link rel="stylesheet" href="assets/css/task3.css">
</head>
<body>

    <h1>Sports Products</h1>

    <div class="products">

    <div class="card">
        <img src="https://images.pexels.com/photos/2529148/pexels-photo-2529148.jpeg" alt="Sports Shoes">
        <h3>Sports Shoes</h3>
        <p>Rs.2,499</p>
    </div>

    <div class="card">
        <img src="https://images.pexels.com/photos/274422/pexels-photo-274422.jpeg" alt="Football">
        <h3>Football</h3>
        <p>Rs.899</p>
    </div>

    <div class="card">
        <img src="https://images.pexels.com/photos/1752757/pexels-photo-1752757.jpeg" alt="Basketball">
        <h3>Basketball</h3>
        <p>Rs.1,299</p>
    </div>

    <div class="card">
        <img src="https://images.pexels.com/photos/163452/cricket-ball-bat-game-163452.jpeg" alt="Cricket Bat">
        <h3>Cricket Bat</h3>
        <p>Rs.2,999</p>
    </div>

    <div class="card">
        <img src="https://images.pexels.com/photos/209977/pexels-photo-209977.jpeg" alt="Tennis Racket">
        <h3>Tennis Racket</h3>
        <p>Rs.1,799</p>
    </div>

    <div class="card">
        <img src="https://images.pexels.com/photos/841130/pexels-photo-841130.jpeg" alt="Sports Bag">
        <h3>Sports Bag</h3>
        <p>Rs.1,199</p>
    </div>

    <div class="card">
        <img src="https://images.pexels.com/photos/949129/pexels-photo-949129.jpeg" alt="Dumbbells">
        <h3>Dumbbells</h3>
        <p>Rs.2,199</p>
    </div>

    <div class="card">
        <img src="https://images.pexels.com/photos/863988/pexels-photo-863988.jpeg" alt="Sports Jersey">
        <h3>Sports Jersey</h3>
        <p>Rs.799</p>
    </div>

</div>

</body>
</html>
