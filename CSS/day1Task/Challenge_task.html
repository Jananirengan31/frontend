<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colored Boxes</title>

    <style>
        .box {
            width: 300px;
            height: 120px;
            text-align: center;
        }
    </style>
</head>
<body>
    <center>

    <div class="box" style="background-color: lightblue; color: darkblue;">
        <h2>Box 1</h2>
        <p>This is the first colored box.</p>
    </div>

    <br>

    <div class="box" style="background-color: lightgreen; color: darkgreen;">
        <h2>Box 2</h2>
        <p>This is the second colored box.</p>
    </div>

    <br>

    <div class="box" style="background-color: lightcoral; color: white;">
        <h2>Box 3</h2>
        <p>This is the third colored box.</p>
    </div>

    <br>

    <div class="box" style="background-color: gold; color: black;">
        <h2>Box 4</h2>
        <p>This is the fourth colored box.</p>
    </div>

    <br>

    <div class="box" style="background-color: plum; color: white;">
        <h2>Box 5</h2>
        <p>This is the fifth colored box.</p>
    </div>
    </center>

</body>
</html>
