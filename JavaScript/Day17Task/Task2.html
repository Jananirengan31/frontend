<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details</title>
    <style>
        body {
    font-family: Arial;
    padding: 20px;
}

input {
    padding: 10px;
    margin: 5px;
}

button {
    padding: 10px 15px;
    cursor: pointer;
}

table {
    border-collapse: collapse;
    width: 600px;
}

th,
td {
    border: 1px solid black;
    padding: 10px;
    text-align: left;
}
    </style>
</head>
<body>

    <h1>Employee Details</h1>

    <input type="text" id="employeeName" placeholder="Employee Name">
    <input type="text" id="department" placeholder="Department">
    <input type="number" id="salary" placeholder="Salary">

    <button id="addEmployee">Add Employee</button>

    <br><br>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Department</th>
                <th>Salary</th>
            </tr>
        </thead>

        <tbody id="employeeList">

        </tbody>
    </table>

    <script src="Assets/js/Task2.js"></script>
</body>
</html>
