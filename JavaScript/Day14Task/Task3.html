<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Card Toggle</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #f2f2f2;
}

.card {
    width: 300px;
    padding: 20px;
    background-color: white;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

.card img {
    width: 100%;
    border-radius: 8px;
}

.card h2 {
    margin: 15px 0;
}

#details {
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: all 0.5s ease;
}

#details.show {
    max-height: 100px;
    opacity: 1;
}

button {
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
    </style>

</head>
<body>

    <div class="card">

        <img src="https://i0.wp.com/picjumbo.com/wp-content/uploads/beautiful-fall-nature-scenery-free-image.jpeg?w=600&quality=80" alt="Sample Image">

        <h2>Beautiful Nature</h2>

        <div id="details">
            <p>
                Nature gives us peace and happiness. 
                Spending time in nature helps us relax and feel fresh.
            </p>
        </div>

        <button id="btn">Show Details</button>

    </div>

    <script src="Assets/Js/Task3.js"></script>
</body>
</html>
