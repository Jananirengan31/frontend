<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Toggle</title>
    <style>
    #title {
    background-color: aqua;
    max-height: 0;
    padding: 0;
    overflow: hidden;
    }

    #title.show {
    max-height: 100px;
    padding: 20px;
    }
    </style>
</head>
<body>
    

    <P id="title">This is the paragraph that can be shown and hidden</P>

    <button id="btn">Show / Hide</button>

    <script src="Assets/Js/Task1.js"></script>
</body>
</html>
